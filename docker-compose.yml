services:
  app:
    build: .
    ports:
      # Loopback only: the admin API is not meant to be reachable from other machines.
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/hackerhelp
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      # The slim image has no curl; Node's built-in fetch probes the readiness endpoint.
      test: ['CMD', 'node', '-e', "fetch('http://localhost:' + (process.env.PORT || 3000) + '/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  mongodb:
    image: mongo:8
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 })']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Append-only file: queued support jobs survive a Redis restart.
    # noeviction: BullMQ requires that Redis never silently drops its keys.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  redis-data:
